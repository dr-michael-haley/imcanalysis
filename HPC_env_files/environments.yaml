schema_version: 1

environments:
  analysis:
    conda_name: sbt-analysis
    specification_directory: HPC_env_files/sbt-analysis
    platform: linux-64
    conda_channel_priority: flexible
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, pydantic, yaml"]
      - [python, -c, "import sys; assert sys.version_info[:2] == (3, 11)"]
      - [python, -c, "import numpy, pandas, scipy, anndata, scanpy, torch, torchvision, pytorch_lightning"]
      - [python, -c, "import cupy, cudf, cuml, cugraph, dask_cudf, rmm, rapids_singlecell"]
      - [python, -c, "import cellpose, nimbus_inference, readimc, skimage, pyarrow, spatialdata"]
      - [python, -c, "import biobatchnet, cellcharter, squidpy"]
      - [python, -c, "import pkg_resources; from importlib.metadata import version; assert int(version('setuptools').split('.', 1)[0]) < 81; assert version('rapids-singlecell') == '0.12.0'; assert version('cugraph').startswith('24.12'); assert version('dask-cudf').startswith('24.12'); assert version('dask') == '2024.11.2'; assert version('distributed') == '2024.11.2'; assert version('dask-expr') == '1.1.19'; assert version('cellcharter') == '0.3.7'; assert version('torch').split('+', 1)[0] == '2.9.1'; assert version('numpy') == '1.26.4'; assert version('scikit-image') == '0.24.0'; assert version('spatialdata') == '0.4.0'; assert version('multiscale-spatial-image') == '2.0.2'; assert version('zarr') == '2.18.7'; assert version('numcodecs') == '0.15.1'; assert version('squidpy') == '1.6.5'"]
      - [python, -c, "import SpatialBiologyToolkit.scripts.basic_process_rapids"]
      - [python, -c, "import SpatialBiologyToolkit.scripts.basic_process_biobatchnet"]
      - [python, -c, "import SpatialBiologyToolkit.scripts.cellcharter_neighborhoods"]
      - [python, -c, "import SpatialBiologyToolkit.scripts.segmentation_nimbus"]
      - [python, -c, "import SpatialBiologyToolkit.scripts.spatialdata_builder"]
    notes:
      - Standard consolidated runtime for segmentation, BioBatchNet, CellCharter, RAPIDS, and SpatialData stages.
      - CellCharter is supported through its default existing-embedding route; optional TRVAE/scArches mode is deliberately excluded from the standard runtime.
      - RAPIDS 24.12 and RAPIDS-singlecell 0.12.0 retain the shared Dask 2024.11 generation required by SpatialData 0.4 and Squidpy 1.6.5. This runtime supports original Harmony only; Harmony2 is outside the standard catalogue.
      - Stage-module smoke tests use separate Python processes, matching SLURM execution; importing the RAPIDS/Scanpy and SpatialData 0.4 stacks sequentially in one interpreter can select incompatible Dask DataFrame backends.
      - Nimbus is included on Python 3.11, within its documented Python 3.9 through 3.11 range.
      - STARLING, MaxFuse, scPortrait, Cellpose-SAM, HyPERSTAC, and denoising remain separate.

  napari:
    conda_name: sbt-napari
    specification_directory: HPC_env_files/sbt-napari
    managed: false
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, pydantic, yaml"]
      - [python, -c, "import napari, qtpy, anndata, pyarrow, sklearn, skimage"]
      - [python, -m, SpatialBiologyToolkit.napari_sbt, --help]
    notes:
      - Interactive-only Linux environment; it is not mapped to a pipeline stage.
      - The CSF3 bootstrap owns installation until a reviewed linux-64 lock is generated on CSF3.

  denoise:
    conda_name: sbt-denoise
    specification_directory: HPC_env_files/sbt-denoise
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, pydantic, yaml"]
      - [python, -c, "from SpatialBiologyToolkit.config import PipelineConfig; from SpatialBiologyToolkit.reporting import StageReporter; PipelineConfig()"]
      - [python, -c, "import IMC_Denoise, tensorflow, tifffile"]

  cellposesam:
    conda_name: sbt-cellpose-sam
    specification_directory: HPC_env_files/sbt-cellpose-sam
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, pydantic, yaml"]
      - [python, -c, "from importlib.metadata import version; assert version('cellpose') == '4.0.7'; assert version('torch') == '2.9.1'; assert version('torchvision') == '0.24.1'; assert version('nvidia-cuda-runtime-cu12') == '12.8.90'"]
      - [bash, -c, 'export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; python -c "from cellpose import models; import skimage; import SpatialBiologyToolkit.scripts.cellpose_sam"']
    notes:
      - Dedicated Cellpose-SAM runtime using the CUDA 12.8 and Torch 2.9.1 generation captured from the working CSF3 environment.
      - CSF3 must load the environment's Conda C++ runtime before Torch; otherwise Torch loads the older system libstdc++ and subsequent SciPy imports fail.

  starling:
    conda_name: sbt-starling
    managed: false
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, starling, torch"]
    notes:
      - External environment; no repository lockfile is currently maintained.

  scportrait:
    conda_name: sbt-scportrait
    managed: false
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, scportrait, torch, h5py"]
    notes:
      - External environment; CellVision uses the repository implementation and does not require the old converter checkout.

  hyperstac:
    conda_name: sbt-hyperstac
    specification_directory: HPC_env_files/sbt-hyperstac
    managed: false
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, anndata, scanpy, tensorflow"]
      - [python, -c, "import lifelines, sksurv, tifffile, seaborn"]
    notes:
      - External GPU environment adapted from the local HyPERSTAC IMC environment.
      - The intent specification is committed, but no platform lock was generated without explicit environment-mutation/lock authority.

  maxfuse:
    conda_name: sbt-maxfuse
    specification_directory: HPC_env_files/sbt-maxfuse
    managed: false
    platform: linux-64
    toolkit_overlay: editable-no-deps
    smoke_tests:
      - [python, -c, "import SpatialBiologyToolkit, anndata, scanpy, seaborn"]
      - [python, -c, "import maxfuse, igraph, leidenalg"]
      - [python, HPC_env_files/sbt-maxfuse/smoke_test.py]
    notes:
      - Dedicated CPU environment for MaxFuse 0.0.2 and notebook-derived reporting.
      - Python 3.10 is required by the current SpatialBiologyToolkit package; MaxFuse supports Python 3.8 and newer.
      - The intent specification is committed, but no platform lock was generated without explicit lock-generation authority.

