# Candidate joint scientific runtime consolidating these existing environments:
#   - imc_segmentation
#   - imc_biobatchnet
#   - imc_cellcharter
#   - rapids_singlecell
#
# STARLING, MaxFuse, scPortrait, Cellpose-SAM, HyPERSTAC, and IMC-Denoise are
# deliberately outside this environment. Nimbus is included provisionally and
# must pass its Python 3.11 smoke and inference tests before stage remapping.
name: sbt-analysis
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda

dependencies:
  # Python 3.11 is shared by the available RAPIDS 24.12 Conda builds,
  # RAPIDS-singlecell 0.12.0, CellCharter 0.3.7, and Nimbus's documented range.
  - python=3.11
  - pip

  # RAPIDS 24.12 is the last release whose official Dask dependency generation
  # matches SpatialData 0.4 and Squidpy 1.6.5. RAPIDS-singlecell 0.12.0 was
  # released for this RAPIDS generation. CUDA 12.5 remains supported by the
  # CSF3 driver used in the successful A100 smoke test.
  - rapids=24.12
  - cuda-version=12.5
  - dask=2024.11.2
  - distributed=2024.11.2
  - dask-expr=1.1.19
  - cudnn
  - cutensor
  - cusparselt

  # Shared scientific-data baseline.
  - numpy=1.26.4
  - pandas>=2.2,<2.4
  - scipy>=1.13,<1.17
  - scikit-learn>=1.6,<1.9
  # RAPIDS 24.12's cuCIM package requires scikit-image <0.25.
  - scikit-image=0.24.0
  - matplotlib>=3.9,<3.11
  - seaborn>=0.13,<0.14
  - h5py>=3.14,<4
  - anndata>=0.10,<0.13
  - scanpy>=1.10,<1.12
  - numba>=0.60,<0.64
  # Zarr 2 imports public Blosc helpers removed in Numcodecs 0.16.
  - numcodecs=0.15.1
  - statsmodels>=0.14,<0.15
  - umap-learn>=0.5,<0.6
  - tqdm>=4.65,<5

  # Graph, image, table, and IMC dependencies shared by the migrated stages.
  - leidenalg>=0.10,<0.13
  - python-igraph>=0.10,<2
  - bbknn>=1.6,<2
  - harmonypy>=0.0.10,<1
  - scikit-misc
  - pyarrow>=15,<23
  - shapely>=2,<3
  - tifffile
  - pillow
  - psutil
  - ipython

  # SBT control/config dependencies required inside scientific jobs.
  - pyyaml>=6
  - pydantic>=2.4,<3
  - typer>=0.12,<1

  # Keep compiled extensions compatible with the CSF3 Linux runtime.
  - libstdcxx-ng>=13
  - libgcc-ng>=13

variables:
  # Required by a legacy transitive dependency in the CellCharter/scArches path.
  SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL: "true"
