# Inactive feasibility baseline adapted from the official RAPIDS-singlecell
# 26.08 CUDA 13 recipe. The production RAPIDS stage remains mapped to
# sbt-analysis while this base is locked and tested independently on CSF3.
name: sbt-rapids
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda

dependencies:
  # Match the official upstream runtime spine before adding SBT-specific
  # scientific dependencies in a later, separately reviewed phase.
  - rapids=26.08
  - python=3.14
  - cuda-version=13.3
  - cudnn
  - cutensor
  - cusparselt
  - jupyterlab
  - pip
