name: imc_cellcharter
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - ipython
  - pip
  - numpy==2.2.5
  - scipy==1.15.3
  - pandas==2.3.3
  - scikit-learn==1.7.2
  - matplotlib==3.10.8
  - seaborn==0.13.2
  - h5py==3.15.1
  - pyyaml==6.0.3
  - tqdm==4.67.3
  - anndata==0.11.4
  - scanpy==1.11.5
  - zarr==2.18.3
  - dask==2024.11.2
  - dask-expr==1.1.19
  - s3fs==2026.2.0
  - leidenalg==0.11.0
  - pytorch==2.10.0
  - shapely==2.1.2
  - statsmodels==0.14.6
  - umap-learn==0.5.11
  - libstdcxx-ng>=13
  - libgcc-ng>=13

variables:
  SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL: true